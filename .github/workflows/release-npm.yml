# npm 发布 + wool-manifest.json 资产上传（push npm-* tag 触发，与主仓发布语义对齐）。
# 清单是 taiji 宿主 install 动作的钉版本源（DEFAULT_WOOL_MANIFEST_URL →
# releases/latest/download/wool-manifest.json）——manifest 随 release 资产上传，
# latest release 永远携带最新清单（D3 验收 a5 发现的发布链缺口的收口件）。
name: Release npm

on:
  push:
    tags:
      - 'npm-*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build (changeset version + publish)
        run: |
          npx changeset version
          pnpm install --no-frozen-lockfile
          npx changeset publish
          git push origin HEAD:main || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Generate manifest
        run: node scripts/gen-manifest.mjs wool-manifest.json

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: wool-manifest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
